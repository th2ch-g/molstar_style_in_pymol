[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "molstar-style-in-pymol"
version = "0.1.0"
description = "Independent Mol*-inspired molecular and volumetric visualization for PyMOL"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSE.colorbrewer"]
dependencies = ["numpy>=1.24", "scipy>=1.15", "PyOpenGL>=3.1.7,<4", "Pillow>=10", "gemmi>=0.7", "msgpack>=1", "scikit-image>=0.21"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
molstar_style_in_pymol = ["shaders/*.vert", "shaders/*.frag", "reference.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
python = "3.10.*"
pymol-open-source = "==3.1.0"

[tool.pixi.pypi-dependencies]
molstar-style-in-pymol = { path = ".", editable = true, extras = ["test"] }
ruff = "*"

[tool.pixi.tasks]
test = "uv run --no-project --python $CONDA_PREFIX/bin/python python -m pytest tests -q"
check = "ruff check src tests"
format = "ruff format src tests"

[tool.pixi.environments]
default = { solve-group = "default" }
